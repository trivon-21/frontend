<header class="topbar">
  <div class="topbar-inner">
    <a [routerLink]="getHomeLink()" class="brand">AirLux</a>

    <div class="search">
      <lucide-angular name="search" class="search-icon"></lucide-angular>
      <input type="text" placeholder="Search" />
    </div>

    <nav class="navlinks">
      <a href="#">View products</a>
      <a routerLink="/" fragment="services">Our Services</a>
      <a href="#">About Us</a>
    </nav>

    <!-- Guest buttons -->
    <div class="authbtns" *ngIf="!currentUser">
      <a routerLink="/login" class="btn solid">Log in</a>
    </div>

    <!-- Logged-in user area -->
    <div class="user-area" *ngIf="currentUser">
      <a [routerLink]="getHomeLink()" class="btn dashboard-btn">Dashboard</a>
      <div class="user-menu" appClickOutside (clickOutside)="closeDropdown()">
        <button class="avatar-btn" (click)="toggleDropdown()" aria-label="User menu">
          <div class="avatar">{{ getInitials(currentUser.fullName) }}</div>
          <span class="user-name">{{ currentUser.fullName.split(' ')[0] }}</span>
          <lucide-angular 
            name="chevron-down" 
            class="chevron" 
            [class.open]="showDropdown" 
            [size]="14"
            strokeWidth="2.5">
          </lucide-angular>
        </button>

        <div class="dropdown" *ngIf="showDropdown">
          <div class="dropdown-header">
            <div class="avatar avatar-lg">{{ getInitials(currentUser.fullName) }}</div>
            <div>
              <div class="dropdown-name">{{ currentUser.fullName }}</div>
              <div class="dropdown-email">{{ currentUser.email }}</div>
            </div>
          </div>
          <div class="dropdown-divider"></div>
          <a [routerLink]="getHomeLink()" class="dropdown-item" (click)="closeDropdown()">
            <lucide-angular name="layout-grid" [size]="16" strokeWidth="2"></lucide-angular>
            My Dashboard
          </a>
          <div class="dropdown-divider"></div>
          <button class="dropdown-item logout-item" (click)="logout()">
            <lucide-angular name="log-out" [size]="16" strokeWidth="2"></lucide-angular>
            Sign out
          </button>
        </div>
      </div>
    </div>
  </div>
</header>
