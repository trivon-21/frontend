<aside class="sidebar">
  <nav class="nav-menu">

    <!-- STANDALONE LINKS (no dropdown) -->
    <ng-container *ngFor="let link of standaloneLinks">
      <a [routerLink]="link.route" routerLinkActive="active" class="standalone-nav-item">
        <span class="section-icon" [innerHTML]="getIcon(link.icon)"></span>
        <span>{{ link.title }}</span>
      </a>
    </ng-container>

    <!-- COLLAPSIBLE SECTIONS -->
    <div class="nav-section" *ngFor="let section of sections">

      <div class="section-header" (click)="toggleSection(section)">
        <div class="section-left">
          <span class="section-icon" [innerHTML]="getIcon(section.icon)"></span>
          <span class="section-title">{{ section.title }}</span>
        </div>
        <span class="chevron" [innerHTML]="getIcon('chevron')" [class.open]="section.isOpen"></span>
      </div>

      <div class="section-items" [class.expanded]="section.isOpen">
        <ng-container *ngFor="let item of section.items">

          <!-- Item WITH children (Repair/Maintenance) -->
          <ng-container *ngIf="item.children && item.children.length > 0">
            <div class="sub-section-header" (click)="toggleItem(item)">
              <div class="section-left">
                <span class="nav-icon" [innerHTML]="getIcon(item.icon)"></span>
                <span class="nav-label sub-label">{{ item.label }}</span>
              </div>
              <span class="chevron small-chevron" [class.open]="item.isOpen" [innerHTML]="getIcon('chevron')"></span>
            </div>
            <div class="sub-items" [class.expanded]="item.isOpen">
              <a *ngFor="let child of item.children"
                [routerLink]="child.route" routerLinkActive="active"
                [routerLinkActiveOptions]="{exact: true}" class="nav-item child-item">
                <span class="nav-icon" [innerHTML]="getIcon(child.icon)"></span>
                <span class="nav-label">{{ child.label }}</span>
              </a>
            </div>
          </ng-container>

          <!-- Regular item WITHOUT children -->
          <a *ngIf="!item.children || item.children.length === 0"
            [routerLink]="item.route" routerLinkActive="active"
            [routerLinkActiveOptions]="{exact: true}" class="nav-item">
            <span class="nav-icon" [innerHTML]="getIcon(item.icon)"></span>
            <span class="nav-label">{{ item.label }}</span>
          </a>

        </ng-container>
      </div>

    </div>

    <!-- LOGOUT -->
    <a (click)="logout()" class="standalone-nav-item logout-btn" style="cursor: pointer; display: flex; align-items: center; gap: 12px; padding: 12px 16px; color: #4b5563; font-weight: 500; font-size: 14px;">
      <span class="section-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </span>
      <span>Logout</span>
    </a>

  </nav>
</aside>
