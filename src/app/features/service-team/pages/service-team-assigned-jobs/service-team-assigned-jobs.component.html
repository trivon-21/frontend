<div class="page-wrapper assigned-jobs-container">
  <!-- Page Header -->
  <header class="page-header">
    <h1 class="page-title">Assigned Jobs</h1>
  </header>

  <!-- Filters & Search Bar Row -->
  <div class="filter-bar">
    <div class="search-input-wrapper">
      <lucide-angular name="search" [size]="18" class="search-icon-lc"></lucide-angular>
      <input
        type="text"
        placeholder="Search by ticket, customer..."
        class="filter-search-input"
        [(ngModel)]="searchQuery"
        (input)="filterTasks()"
      >
    </div>

    <div class="filter-actions">
      <div class="filter-controls">
        <span class="filter-label">
          <lucide-angular name="filter" [size]="16"></lucide-angular>
          Filters:
        </span>
        <select
          class="filter-select"
          [(ngModel)]="statusFilter"
          (change)="filterTasks()"
        >
          <option value="All">All</option>
          <option value="Assigned">Assigned</option>
          <option value="In Progress">In Progress</option>
          <option value="Completed">Completed</option>
          <option value="On Hold">On Hold</option>
        </select>
      </div>
      <button class="btn-secondary clear-filters" (click)="clearFilters()">
        <lucide-angular name="x" [size]="14"></lucide-angular>
        Clear Filters
      </button>
    </div>
  </div>

  <!-- Jobs List Rows -->
  <div class="jobs-list">
    <div class="job-card card-panel" *ngFor="let task of filteredTasks">
      <div class="job-info">
        <div class="job-id-title">
          <h3 class="job-heading">
            #{{ task.id }} - {{ task.type }}
          </h3>
          <p class="customer-name">
            {{ task.customer?.name || task.customer }}
          </p>
        </div>

        <div class="job-details-grid">
          <div class="detail-item">
            <label class="detail-label">Location</label>
            <span class="detail-value" [title]="task.location">
              {{ task.location }}
            </span>
          </div>
          <div class="detail-item">
            <label class="detail-label">Product Type</label>
            <span class="detail-value">
              {{ task.detailedProductType || task.serviceType || '-' }}
            </span>
          </div>
        </div>
      </div>

      <div class="job-status-action">
        <span class="status-badge" [ngClass]="statusClass(task.status)">
          {{ displayStatus(task.status) }}
        </span>
        <button class="btn-primary view-btn" [routerLink]="[baseRoute + '/service-details', task.sourceId || task.id]">
          View
        </button>
      </div>
    </div>

    <!-- Empty State -->
    <div class="no-results card-panel" *ngIf="filteredTasks.length === 0">
      <p>No jobs found matching your criteria.</p>
    </div>
  </div>
</div>
