<header class="dashboard-header">
  <a *ngIf="!showBackButton" routerLink="/" class="back-home-btn" aria-label="Back to Home">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="15 18 9 12 15 6"/>
    </svg>
    <span>Home</span>
  </a>

  <!-- Back button if details view, else we show Home -->
  <button *ngIf="showBackButton" class="back-home-btn" (click)="goBack()" aria-label="Go Back">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="15 18 9 12 15 6"/>
    </svg>
    <span>Back</span>
  </button>

  <div class="header-spacer"></div>

  <div class="header-actions">
    <!-- Clock Section -->
    <div class="clock-and-maintenance">
      <div class="header-clock">
        <span class="clock-time">{{ currentTime }}</span>
        <span class="clock-date">{{ currentDate }}</span>
      </div>
    </div>

    <!-- User Menu -->
    <div class="user-menu-container" appClickOutside (clickOutside)="closeDropdown()">
      <button class="user-avatar" (click)="toggleDropdown($event)" aria-label="User menu" title="User menu">
        {{ userInitials }}
      </button>

      <!-- User Dropdown -->
      <div class="user-dropdown" *ngIf="isDropdownOpen">
        <div class="user-header">
          <div class="user-avatar-lg">{{ userInitials }}</div>
          <div>
            <div class="user-name">{{ userName }}</div>
            <div class="user-email">{{ userEmail }}</div>
          </div>
        </div>
        <div class="menu-divider"></div>
        <a [routerLink]="baseRoute + '/team-details'" class="menu-item" (click)="closeDropdown()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
          </svg>
          Team Details
        </a>
        <div class="menu-divider"></div>
        <button class="menu-item logout" (click)="logout()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
            <polyline points="16 17 21 12 16 7" />
            <line x1="21" y1="12" x2="9" y2="12" />
          </svg>
          Sign out
        </button>
      </div>
    </div>
  </div>
</header>
