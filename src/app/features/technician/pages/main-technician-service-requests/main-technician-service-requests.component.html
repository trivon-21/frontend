<div class="service-requests-container">
  <header class="table-header">
    <div class="search-box">
      <span class="search-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      </span>
      <input type="text" placeholder="Search by ticket, customer..." [(ngModel)]="searchQuery" (input)="onSearchInput()">
    </div>

    <div class="header-actions">
      <div class="filter-group">
        <span class="filter-label">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
          Filters:
        </span>
        <select [(ngModel)]="statusFilter" (change)="filterRequests()">
          <option value="All">All</option>
          <option value="In Progress">In Progress</option>
          <option value="Scheduled">Scheduled</option>
          <option value="Completed">Completed</option>
          <option value="On Hold">On Hold</option>
        </select>
      </div>
      <button class="clear-filters" (click)="clearFilters()">Clear Filters</button>
    </div>
  </header>

  <div class="table-wrapper">
    <table class="service-requests-table">
      <thead>
        <tr>
          <th>TICKET ID</th>
          <th>CUSTOMER NAME</th>
          <th>PRODUCT TYPE</th>
          <th>LOCATION</th>
          <th>DATE</th>
          <th>STATUS</th>
          <th>ASSIGNED TEAM</th>
          <th>ACTIONS</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let request of filteredRequests">
          <td class="ticket-id">{{ request.id }}</td>
          <td>{{ request.customerName }}</td>
          <td>{{ request.productType }}</td>
          <td>{{ request.location }}</td>
          <td class="date-cell">
            {{ request.date }}<br>
            <span class="year">{{ request.year }}</span>
          </td>
          <td>
            <span class="status-pill" [ngClass]="request.status.toLowerCase().replace(' ', '-')">
              {{ request.status }}
            </span>
          </td>
          <td>{{ request.assignedTeam }}</td>
          <td>
            <button class="review-btn" (click)="viewServiceDetails(request.id)">View</button>
          </td>
        </tr>
      </tbody>
    </table>

    <div class="pagination-section">
      <span class="pagination-info">{{ resultsSummary }}</span>
      <div class="pagination-controls">
        <button class="pagination-link prev">Previous</button>
        <button class="pagination-link active">1</button>
        <button class="pagination-link">2</button>
        <button class="pagination-link">3</button>
        <span class="dots">...</span>
        <button class="pagination-link">31</button>
        <button class="pagination-link next">Next</button>
      </div>
    </div>
  </div>
</div>
