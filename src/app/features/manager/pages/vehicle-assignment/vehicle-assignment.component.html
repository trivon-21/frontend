
<div class="assignment-layout">
  <!-- Left Sidebar: Queue -->
  <aside class="sidebar-queue glass-panel">
    <app-assignment-queue [jobs]="(jobs$ | async) || []"></app-assignment-queue>
  </aside>

  <!-- Main Content -->
  <main class="main-content">
    <div class="header-section">
      <h1>Vehicle Assignment & Dispatch</h1>
      <p>Assign vehicles to pending jobs and track fleet status.</p>
    </div>

    <!-- Map Placeholder (Top half) -->
    <div class="map-section glass-panel">
      <app-map-placeholder></app-map-placeholder>
    </div>

    <!-- Vehicle Roster (Bottom half) -->
    <div class="roster-section glass-panel">
      <div class="section-title">
        <h2>Fleet Status</h2>
        <span class="badge">{{ (vehicles$ | async)?.length }} Total</span>
      </div>
      <app-vehicle-roster [vehicles]="(vehicles$ | async) || []"></app-vehicle-roster>
    </div>
  </main>
</div>
