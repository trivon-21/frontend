
<div class="queue-container">
  <div class="queue-header">
    <h3>Pending Dispatch ({{ jobs.length }})</h3>
  </div>
  <div class="job-list">
    <div class="job-card" *ngFor="let job of jobs">
      <div class="job-top">
        <span class="priority-badge" [ngClass]="job.priority.toLowerCase()">{{ job.priority }}</span>
        <span class="ticket-id">{{ job.ticketId }}</span>
      </div>
      <h4>{{ job.customerName }}</h4>
      <p class="address"><lucide-angular name="map-pin" [size]="14"></lucide-angular> {{ job.address }}</p>
      <div class="job-bottom">
        <span class="time"><lucide-angular name="clock" [size]="14"></lucide-angular> {{ job.scheduledTime }}</span>
        <button class="btn-assign">Assign</button>
      </div>
    </div>
  </div>
</div>
