<div class="summary-grid">
  <a class="summary-card clickable" routerLink="/manager/work-items">
    <div class="card-main">
      <div class="card-icon tint-blue"><lucide-angular name="clipboard-list" [size]="22"></lucide-angular></div>
      <div class="card-info"><span class="card-label">Open Tickets</span><span class="card-value">{{ data.stats.openTickets.total }}</span></div>
    </div>
  </a>

  <a class="summary-card clickable" routerLink="/manager/inventory">
    <div class="card-main">
      <div class="card-icon tint-green">
        <lucide-angular name="package" [size]="22"></lucide-angular>
      </div>
      <div class="card-info">
        <span class="card-label">Inventory Health</span>
        <span class="card-value" [class.risk-text]="totalStockRiskCount > 0">{{ totalStockRiskCount }}</span>
      </div>
    </div>
  </a>

  <a class="summary-card clickable" routerLink="/manager/work-items" [queryParams]="{ sla: 'overdue' }">
    <div class="card-main">
      <div class="card-icon tint-red"><lucide-angular name="timer-off" [size]="22"></lucide-angular></div>
      <div class="card-info"><span class="card-label">SLA Risk</span><span class="card-value">{{ data.stats.slaRisk.total }}</span></div>
    </div>
  </a>

  <article class="summary-card clickable approval-card">
    <a
      class="approval-card-primary"
      routerLink="/manager/orders"
      [queryParams]="{ type: 'purchase', status: 'pending-manager' }"
      aria-label="Open pending purchase approvals"
    >
      <div class="card-main">
        <div class="card-icon tint-amber"><lucide-angular name="shopping-bag" [size]="22"></lucide-angular></div>
        <div class="card-info"><span class="card-label">Pending Approvals</span><span class="card-value">{{ data.stats.pendingApprovals.total }}</span></div>
      </div>
    </a>
    <nav class="approval-links sr-only" aria-label="Approval queues">
      <a class="sub-stat clickable-sub-stat" routerLink="/manager/orders" [queryParams]="{ type: 'purchase', status: 'pending-manager' }">
        <span class="sub-label">Purchase</span>
      </a>
      <a class="sub-stat clickable-sub-stat" routerLink="/manager/orders" [queryParams]="{ type: 'non-po', status: 'pending' }">
        <span class="sub-label">Non-PO</span>
      </a>
    </nav>
  </article>
</div>
