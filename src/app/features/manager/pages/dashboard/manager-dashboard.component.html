<div class="inventory-dashboard">
  <div class="offline-banner" *ngIf="data.status === 'Offline'">
    <lucide-angular name="triangle-alert" [size]="20"></lucide-angular>
    <div class="banner-text">
      <strong>Live data unavailable</strong>
      <span>Operational values are shown as zero until the database reconnects.</span>
    </div>
  </div>

  <div class="portal-state portal-state--error" *ngIf="errorMessage" role="alert">
    <lucide-angular name="triangle-alert" [size]="22"></lucide-angular>
    <div><strong>Dashboard unavailable</strong><p>{{ errorMessage }}</p></div>
    <button type="button" class="portal-retry-button mgr-btn mgr-btn--primary mgr-btn--compact" (click)="loadData()" [disabled]="loading">Retry</button>
  </div>

  <div class="welcome-banner">
    <div class="banner-content">
      <div class="title-row">
        <h1 class="welcome-title">Welcome back, {{ data.managerName }}!</h1>
        <span class="status-badge" [class.offline]="data.status === 'Offline'">
          <span class="dot" [class.syncing]="loading"></span>
          {{ loading ? 'Syncing...' : data.status }}
        </span>
      </div>
    </div>
    <div class="dashboard-actions mgr-action-group">
      <a class="mgr-btn mgr-btn--secondary" routerLink="/manager/inventory">
        <lucide-angular name="package" [size]="16"></lucide-angular>
        View Inventory
      </a>
      <a class="mgr-btn mgr-btn--primary" routerLink="/manager/work-items">
        <lucide-angular name="clipboard-list" [size]="16"></lucide-angular>
        Open Work Queue
      </a>
    </div>
  </div>

  <app-mgr-summary-cards [data]="data"></app-mgr-summary-cards>

  <app-mgr-insights-grid [data]="data" [analyticsData]="analyticsData"></app-mgr-insights-grid>

  <div class="dashboard-main-grid">
    <app-mgr-pending-actions [data]="data"></app-mgr-pending-actions>

    <app-mgr-workforce-card
      [workloadList]="data.workloadPreview || []"
      [unassignedTotal]="data.stats.unassignedTickets.total"
    ></app-mgr-workforce-card>
  </div>
</div>
