<div class="new-order-page animate-fade">
  <div class="portal-state" *ngIf="loading" role="status" aria-live="polite">Loading order form…</div>
  <div class="portal-state portal-state--error" role="alert" *ngIf="!loading && loadError">
    <div><strong>Order form unavailable</strong><p>{{ loadError }}</p></div>
    <button type="button" class="portal-retry-button im-btn im-btn--primary im-btn--compact" (click)="loadData()">Retry</button>
  </div>

  <div class="order-card" *ngIf="!loading && !loadError">
    <div class="split-layout">
      <!-- Left Column: Form Inputs -->
      <div class="layout-left">
        <div class="card-title-group">
          <h1 *ngIf="!isEditMode">New Purchase Order Request</h1>
          <h1 *ngIf="isEditMode">Edit Purchase Order Request</h1>
          <p class="subtitle">Fill in the details below to {{ isEditMode ? 'update your draft' : 'request a new purchase order' }} for approval.</p>
          <span class="draft-badge" *ngIf="isEditMode">DRAFT: {{ orderId }}</span>
        </div>

        <!-- Messages -->
        <div class="alerts-wrap" *ngIf="successMessage || errorMessage">
          <div class="alert success" *ngIf="successMessage" role="status" aria-live="polite">{{ successMessage }}</div>
          <div class="alert error" *ngIf="errorMessage">{{ errorMessage }}</div>
        </div>

        <!-- Step 1: Supplier Selector Dumb Component -->
        <app-order-supplier-selector
          [suppliers]="suppliers"
          [relevantSuppliers]="relevantSuppliers"
          [initialSupplier]="selectedSupplier"
          [revertSignal]="supplierRevertSignal"
          (supplierSelected)="onSupplierSelected($event)"
          (newSupplierRequested)="onAddNewSupplier($event)"
          (registeringNewSupplier)="onRegisteringNewSupplier($event)">
        </app-order-supplier-selector>

        <div class="step-divider"></div>

        <!-- Step 2: Item Search Dumb Component -->
        <app-order-item-search
          [inventoryItems]="availableInventoryItems"
          [allInventoryItems]="inventoryItems"
          [selectedSupplierId]="selectedSupplierId"
          [selectedSupplierName]="selectedSupplier"
          (itemSelected)="onItemSelected($event.item, $event.reassign)"
          (itemCleared)="onItemCleared()"
          (itemAdded)="onItemAdded($event)"
          (productSupplierChanged)="onProductSupplierChanged($event)">
        </app-order-item-search>

        <div class="form-footer">
          <div class="additional-details">
            <button
              type="button"
              class="btn-add-details"
              *ngIf="!showAdditionalDetails"
              (click)="showAdditionalDetails = true">
              <lucide-angular name="plus" [size]="15" strokeWidth="2.5"></lucide-angular>
              <span>Add additional details</span>
            </button>
            <div class="form-group" *ngIf="showAdditionalDetails">
              <label for="order-notes">Order Notes / Justification</label>
              <textarea
                id="order-notes"
                [(ngModel)]="orderNotes"
                class="form-textarea"
                placeholder="Add any additional context for the approver..."
                rows="3"></textarea>
            </div>
          </div>

          <div class="form-footer-actions">
            <button type="button" class="btn-discard im-btn im-btn--ghost" (click)="goBack()">Discard Changes</button>
            <div class="action-group">
              <button type="button" class="btn-secondary im-btn im-btn--secondary" (click)="saveDraft()" [disabled]="isSubmitting">
                {{ isEditMode ? 'Update Draft' : 'Save Draft' }}
              </button>
              <button type="button" class="btn-primary im-btn im-btn--primary" [disabled]="isSubmitting" (click)="submitOrder()">
                <span *ngIf="!isSubmitting">Submit Order</span>
                <span *ngIf="isSubmitting">...</span>
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Right Column: Added Items List Dumb Component -->
      <app-order-cart-list
        [orderItems]="orderItems"
        [supplierName]="selectedSupplier"
        (itemUpdated)="onItemUpdated($event)"
        (itemRemoved)="onItemRemoved($event)"
        (closeClicked)="goBack()">
      </app-order-cart-list>
    </div>
  </div>
</div>
