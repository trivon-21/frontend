<div class="layout-right">
  <div class="right-header">
    <h3>Added Items List</h3>
    <button
      type="button"
      class="btn-close-panel im-btn im-btn--close"
      *ngIf="showCloseButton"
      aria-label="Close and return to order requests"
      (click)="closeClicked.emit()">
      <lucide-angular name="x" [size]="20" strokeWidth="2.5"></lucide-angular>
    </button>
  </div>

  <div class="supplier-summary">
    <span class="supplier-label">Supplier</span>
    <span class="supplier-value" [class.unset]="!supplierName">{{ supplierName || 'No supplier selected yet' }}</span>
  </div>

  <div class="added-items-content">
    <div class="empty-items-state" *ngIf="orderItems.length === 0" role="status">
      <div class="empty-icon">
        <lucide-angular name="package" [size]="40" strokeWidth="1.5" color="var(--border-medium)"></lucide-angular>
      </div>
      <p class="empty-text">No items added yet.</p>
    </div>

    <div class="items-box" *ngIf="orderItems.length > 0" role="region" aria-label="Order cart line items">
      <div class="items-box-scroll">
        <div
          class="item-row clickable-row"
          *ngFor="let item of orderItems; let i = index"
          [class.selected-row]="selectedLineItemIndex === i"
          (click)="selectLineItem(i)">
          <div class="item-row-main">
            <span class="item-name">{{ item.name }}</span>
            <span class="item-sub">
              {{ item.sku }}
              <ng-container *ngIf="selectedLineItemIndex !== i"> · ×{{ item.quantity }}</ng-container>
            </span>
            <div class="qty-editor" *ngIf="selectedLineItemIndex === i" (click)="$event.stopPropagation()">
              <button type="button" [attr.aria-label]="'Decrease quantity for ' + item.name" (click)="updateItemQuantity(i, item.quantity - 1, $event)">
                <lucide-angular name="minus" [size]="14"></lucide-angular>
              </button>
              <input type="number" [ngModel]="item.quantity" (ngModelChange)="updateItemQuantity(i, $event)" class="inline-qty-input no-spinner">
              <button type="button" [attr.aria-label]="'Increase quantity for ' + item.name" (click)="updateItemQuantity(i, item.quantity + 1, $event)">
                <lucide-angular name="plus" [size]="14"></lucide-angular>
              </button>
            </div>
          </div>
          <div class="item-row-end">
            <span class="item-row-value">{{ formatCurrency(item.estimatedTotal) }}</span>
            <button type="button" class="btn-delete-row im-btn im-btn--danger im-btn--compact im-btn--icon" *ngIf="selectedLineItemIndex === i" [attr.aria-label]="'Remove ' + item.name" (click)="removeLineItem(i, $event)">
              <lucide-angular name="trash-2" [size]="16"></lucide-angular>
            </button>
          </div>
        </div>
      </div>

    </div>
  </div>

  <div class="totals-footer">
    <div class="totals-row">
      <span class="totals-label">Total Items</span>
      <span class="totals-value">{{ orderItems.length }}</span>
    </div>
    <div class="totals-row estimated">
      <span class="estimated-label">Estimated Total</span>
      <span class="estimated-value">{{ formatCurrency(orderTotal) }}</span>
    </div>
  </div>

</div>
