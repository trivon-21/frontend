<div class="list-items-container">
  <!-- Header -->
  <div class="header">
    <h1>List Items</h1>
    <button class="btn-procurement">
      <i class="icon-procurement"></i>
      Procurement
    </button>
  </div>

  <!-- Filters Section -->
  <div class="filters-row">
    <div class="search-box">
      <i class="icon-search"></i>
      <input type="text" [(ngModel)]="searchQuery" placeholder="Search Inventory...">
    </div>
    
    <div class="filter-group">
      <span class="filter-label">Filters:</span>
      
      <div class="select-wrapper">
        <select [(ngModel)]="selectedType">
          <option>Tools</option>
        </select>
      </div>

      <div class="select-wrapper">
        <select [(ngModel)]="selectedBrand">
          <option>All Brands</option>
        </select>
      </div>

      <div class="select-wrapper">
        <select [(ngModel)]="selectedLocation">
          <option>Location</option>
        </select>
      </div>

      <button class="btn-clear" (click)="clearFilters()">Clear Filters</button>
    </div>
  </div>

  <!-- Dual Lists Layout -->
  <div class="lists-grid">
    <!-- Pending Items -->
    <div class="list-column glass-panel">
      <div class="column-header">
        <h2>Items to be listed</h2>
      </div>
      <div class="items-list">
        <div class="item-card" *ngFor="let item of pendingItems">
          <div class="item-icon pending">
            <i class="icon-box"></i>
          </div>
          <div class="item-info">
            <span class="item-name">{{ item.name }}</span>
            <span class="item-sku">{{ item.sku }}</span>
          </div>
          <button class="btn-add-details" [routerLink]="['/inventory-manager/product-wizard', item.id]">Add Details</button>
        </div>
      </div>
    </div>

    <!-- Listed Items -->
    <div class="list-column glass-panel">
      <div class="column-header">
        <h2>Listed Items</h2>
      </div>
      <div class="items-list">
        <div class="item-card" *ngFor="let item of listedItems">
          <div class="item-icon success">
            <i class="icon-check"></i>
          </div>
          <div class="item-info">
            <span class="item-name">{{ item.name }}</span>
            <span class="item-sku">{{ item.sku }}</span>
          </div>
          <div class="item-meta">
            <i class="icon-clock"></i>
            <span>{{ item.time }}</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
