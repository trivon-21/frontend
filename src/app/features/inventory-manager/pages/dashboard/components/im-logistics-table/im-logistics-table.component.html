<div class="content-card logistics-card">
  <div class="card-header">
    <div class="title-with-icon">
      <lucide-angular name="truck" class="primary-icon" [size]="18"></lucide-angular>
      <h2 class="card-title">Dispatch Logistics</h2>
    </div>
    <div class="card-header-actions">
      <span class="count-badge">{{ orders.length }} Orders</span>
      <a routerLink="/inventory-manager/dispatch-logistics" class="view-all-link">View All</a>
    </div>
  </div>
  <div class="table-container alx-table-container" role="region" aria-label="Dispatch logistics list" tabindex="0">
    <table *ngIf="orders.length > 0; else emptyLogistics" class="logistics-table alx-table alx-table--fixed alx-table--sticky-header">
      <thead>
        <tr>
          <th>Order</th>
          <th>Status</th>
          <th>Courier / Track</th>
          <th class="text-right">Last Moved</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let order of orders"
            class="clickable-row"
            routerLink="/inventory-manager/dispatch-logistics">
          <td class="order-id-cell">
            <div class="order-cell-wrapper">
              <a class="order-id-link" routerLink="/inventory-manager/dispatch-logistics">{{ order.orderId }}</a>
              <span class="order-customer" *ngIf="order.customer">{{ order.customer }}</span>
            </div>
          </td>
          <td>
            <span class="logistics-status-badge" [ngClass]="order.status">{{ order.status }}</span>
          </td>
          <td class="courier-cell">
            <span class="courier-text">{{ order.courier || 'Unassigned' }}</span>
            <span class="track-id-text" *ngIf="order.trackId">{{ order.trackId }}</span>
          </td>
          <td class="text-right last-moved-cell">
            {{ (order.lastMovedAt || order.date) | date:'shortDate' }}
          </td>
        </tr>
      </tbody>
    </table>
    <ng-template #emptyLogistics>
      <div class="empty-state">No dispatch orders recorded.</div>
    </ng-template>
  </div>
</div>
