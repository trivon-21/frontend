<div class="summary-grid">
  <!-- Material Reservations -->
  <a class="summary-card clickable" routerLink="/inventory-manager/material-requests">
    <div class="card-main">
      <div class="card-icon tint-blue">
        <lucide-angular name="clipboard-check" [size]="24"></lucide-angular>
      </div>
      <div class="card-info">
        <span class="card-label">Stock Reservations</span>
        <span class="card-value">{{ stats.materialReservations.total }}</span>
      </div>
    </div>
  </a>

  <!-- Dispatch Queue -->
  <a class="summary-card clickable" routerLink="/inventory-manager/dispatch-logistics">
    <div class="card-main">
      <div class="card-icon tint-green">
        <lucide-angular name="truck" [size]="24"></lucide-angular>
      </div>
      <div class="card-info">
        <span class="card-label">Dispatch Queue</span>
        <span class="card-value">{{ stats.dispatchQueue.total }}</span>
      </div>
    </div>
  </a>

  <!-- Asset Health -->
  <a class="summary-card clickable" routerLink="/inventory-manager/asset-management">
    <div class="card-main">
      <div class="card-icon tint-amber">
        <lucide-angular name="wrench" [size]="24"></lucide-angular>
      </div>
      <div class="card-info">
        <span class="card-label">Tool Status</span>
        <span class="card-value">{{ stats.assetHealth.total }}</span>
      </div>
    </div>
  </a>

  <!-- Stock Alerts -->
  <a class="summary-card clickable" routerLink="/inventory-manager/inventory">
    <div class="card-main">
      <div class="card-icon tint-red">
        <lucide-angular name="triangle-alert" [size]="24"></lucide-angular>
      </div>
      <div class="card-info">
        <span class="card-label">Stock Alerts</span>
        <span class="card-value">{{ stats.stockAlerts.total }}</span>
      </div>
    </div>
  </a>
</div>
