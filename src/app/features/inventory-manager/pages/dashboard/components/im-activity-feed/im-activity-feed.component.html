<div class="content-card activity-card">
  <div class="card-header">
    <h2 class="card-title">Recent Activity</h2>
    <a routerLink="/inventory-manager/activity-log" class="view-all-link">View All</a>
  </div>
  <div class="timeline-container">
    <div *ngFor="let row of visibleActivities" class="timeline-item">
      <div class="timeline-line"></div>
      <div class="timeline-marker" [ngClass]="row.activity.type">
        <lucide-angular [name]="getActivityIcon(row.activity.type)" [size]="20"></lucide-angular>
      </div>
      <div class="timeline-content">
        <div class="timeline-header">
          <p class="activity-title">{{ row.activity.title }}</p>
          <span class="activity-time">{{ row.activity.timeAgo }}</span>
        </div>
        <div class="activity-actions" *ngIf="row.route">
          <a class="activity-btn im-btn im-btn--secondary im-btn--compact" [routerLink]="row.route">
            {{ row.activity.actionLabel }}
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
