<div class="inventory-dashboard">
  <div class="portal-state portal-state--error" *ngIf="error" role="alert">
    <div><strong>Dashboard unavailable</strong><p>{{ error }}</p></div>
    <button type="button" class="portal-retry-button im-btn im-btn--primary im-btn--compact" (click)="loadData()" [disabled]="loading">Retry</button>
  </div>

  <div class="portal-state portal-state--warning stale-banner" *ngIf="isStale" role="status">
    <lucide-angular name="triangle-alert" [size]="18"></lucide-angular>
    <div>
      <strong>Displaying stale data</strong>
      <p>Unable to refresh latest metrics from server. Showing last successful snapshot.</p>
    </div>
  </div>

  <ng-container *ngIf="hasLoadedSuccess">
    <!-- Header Section -->
    <div class="welcome-banner">
      <div class="banner-content">
        <div class="title-row">
          <h1 class="welcome-title">Welcome back, {{ data.managerName }}!</h1>
          <span class="status-badge" [class.offline]="data.status === 'Offline'" [class.stale]="isStale">
            <span class="dot" [class.syncing]="loading"></span>
            {{ loading ? 'Syncing...' : (isStale ? 'Stale' : data.status) }}
          </span>
        </div>
      </div>
      <div class="dashboard-actions im-action-group">
        <a class="btn-new-order im-btn im-btn--primary" routerLink="/inventory-manager/order-creation">
          <lucide-angular name="plus" [size]="16"></lucide-angular>
          Create New Order
        </a>
      </div>
    </div>

    <app-im-summary-cards [stats]="data.stats"></app-im-summary-cards>

    <app-im-workflow-panel [workflow]="data.procurementWorkflow"></app-im-workflow-panel>

    <!-- Main Grid Content -->
    <div class="dashboard-main-grid">
      <app-im-activity-feed [activities]="data.recentActivity"></app-im-activity-feed>

      <div class="side-column">
        <app-im-reorder-table [items]="data.reorderList"></app-im-reorder-table>
        <app-im-logistics-table [orders]="data.logistics"></app-im-logistics-table>
      </div>
    </div>
  </ng-container>
</div>
