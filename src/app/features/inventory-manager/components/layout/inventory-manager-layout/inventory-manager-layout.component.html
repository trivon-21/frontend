<div class="dashboard-wrapper">
  <!-- Sidebar -->
  <aside class="sidebar">
    <a routerLink="/inventory-manager" class="sidebar-brand">
      AirLux
    </a>
    <nav class="sidebar-nav">
      <a
        routerLink="/inventory-manager"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        class="nav-item"
      >
        <lucide-angular name="layout-dashboard" [size]="20" strokeWidth="1.8"></lucide-angular>
        <span>Dashboard</span>
      </a>
      <a routerLink="/inventory-manager/inventory" routerLinkActive="active" class="nav-item">
        <lucide-angular name="package" [size]="20" strokeWidth="1.8"></lucide-angular>
        <span>Inventory</span>
      </a>
      <a
        routerLink="/inventory-manager/asset-management"
        routerLinkActive="active"
        class="nav-item"
      >
        <lucide-angular name="wrench" [size]="20" strokeWidth="1.8"></lucide-angular>
        <span>Tool Lending</span>
      </a>
      <a
        routerLink="/inventory-manager/material-requests"
        routerLinkActive="active"
        class="nav-item"
      >
        <lucide-angular name="clipboard-list" [size]="20" strokeWidth="1.8"></lucide-angular>
        <span>Stock Reservations</span>
      </a>
      <a
        routerLink="/inventory-manager/dispatch-logistics"
        routerLinkActive="active"
        class="nav-item"
      >
        <lucide-angular name="truck" [size]="20" strokeWidth="1.8"></lucide-angular>
        <span>Logistics</span>
      </a>
      <a routerLink="/inventory-manager/order-creation" routerLinkActive="active" class="nav-item">
        <lucide-angular name="shopping-cart" [size]="20" strokeWidth="1.8"></lucide-angular>
        <span>Order Creation</span>
      </a>
      <a routerLink="/inventory-manager/procurement" routerLinkActive="active" class="nav-item">
        <lucide-angular name="clipboard-check" [size]="20" strokeWidth="1.8"></lucide-angular>
        <span>Procurement</span>
      </a>
      <a routerLink="/inventory-manager/returns-rma" routerLinkActive="active" class="nav-item">
        <lucide-angular name="rotate-ccw" [size]="20" strokeWidth="1.8"></lucide-angular>
        <span>Returns</span>
      </a>
    </nav>
  </aside>

  <!-- Main area -->
  <div class="dashboard-main">
    <!-- Header -->
    <header class="dashboard-header">
      <div class="header-search-wrap">
        <lucide-angular name="search" class="search-icon" [size]="18" strokeWidth="2"></lucide-angular>
        <input class="header-search" type="text" placeholder="Search product, supplier, order" />
      </div>
      <div class="header-actions">
        <!-- Notifications -->
        <div class="notifications-container" appClickOutside (clickOutside)="closeNotifications()">
          <button
            class="icon-btn"
            aria-label="Notifications"
            (click)="toggleNotifications()"
            title="Notifications"
          >
            <lucide-angular name="bell" [size]="20" strokeWidth="1.8"></lucide-angular>
            <span class="notification-badge" *ngIf="unreadCount > 0">{{ unreadCount }}</span>
          </button>

          <!-- Notifications Dropdown -->
          <div class="notifications-dropdown" *ngIf="showNotifications">
            <div class="notifications-header">
              <h3>Notifications</h3>
              <div class="notifications-actions">
                <button
                  class="action-link"
                  (click)="markAllAsRead()"
                  *ngIf="unreadCount > 0"
                  title="Mark all as read"
                >
                  <lucide-angular name="check" [size]="14" strokeWidth="2"></lucide-angular>
                </button>
                <button
                  class="action-link"
                  (click)="clearAllNotifications()"
                  *ngIf="notifications.length > 0"
                  title="Clear all"
                >
                  <lucide-angular name="x" [size]="14" strokeWidth="2"></lucide-angular>
                </button>
              </div>
            </div>

            <div class="notifications-list">
              <div *ngIf="notifications.length === 0" class="empty-state">
                <span>No notifications yet</span>
              </div>
              <div
                *ngFor="let notif of notifications.slice(0, 8)"
                class="notification-item"
                [class.unread]="!notif.read"
                (click)="navigateToNotification(notif)"
              >
                <lucide-angular
                  [name]="getNotificationIcon(notif.type)"
                  class="notif-icon"
                ></lucide-angular>
                <div class="notif-content">
                  <div class="notif-title">{{ notif.title }}</div>
                  <div class="notif-message">{{ notif.message }}</div>
                </div>
                <button
                  class="notif-delete"
                  (click)="deleteNotification(notif.id, $event)"
                  aria-label="Delete"
                >
                  <lucide-angular name="x" [size]="14"></lucide-angular>
                </button>
              </div>
            </div>
          </div>
        </div>

        <!-- User Menu -->
        <div class="user-menu-container" appClickOutside (clickOutside)="closeUserMenu()">
          <button
            class="user-avatar"
            (click)="toggleUserMenu(); $event.stopPropagation()"
            aria-label="User menu"
            title="User menu"
          >
            {{ userInitials }}
          </button>

          <!-- User Dropdown -->
          <div class="user-dropdown" *ngIf="showUserMenu">
            <div class="user-header">
              <div class="user-avatar-lg">{{ userInitials }}</div>
              <div>
                <div class="user-name">{{ userName }}</div>
                <div class="user-email">{{ userEmail }}</div>
              </div>
            </div>
            <div class="menu-divider"></div>

            <button class="menu-item logout" (click)="logout()">
              <lucide-angular name="log-out" [size]="16" strokeWidth="1.8"></lucide-angular>
              Sign out
            </button>
          </div>
        </div>
      </div>
    </header>

    <!-- Page content -->
    <main class="dashboard-content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
