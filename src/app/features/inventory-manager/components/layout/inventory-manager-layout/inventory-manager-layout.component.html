<div class="dashboard-wrapper">
  <!-- Sidebar -->
  <aside class="sidebar">
    <a routerLink="/inventory-manager" class="sidebar-brand">AirLux</a>
    <nav class="sidebar-nav">
      <a
        routerLink="/inventory-manager"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        class="nav-item"
      >
        <svg
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9.5z" />
          <path d="M9 21V12h6v9" />
        </svg>
        <span>Dashboard</span>
      </a>
      <a routerLink="/inventory-manager/inventory" routerLinkActive="active" class="nav-item">
        <svg
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z" />
          <line x1="3" y1="6" x2="21" y2="6" />
          <path d="M16 10a4 4 0 0 1-8 0" />
        </svg>
        <span>Inventory</span>
      </a>
      <a
        routerLink="/inventory-manager/asset-management"
        routerLinkActive="active"
        class="nav-item"
      >
        <svg
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M12 2L2 7v10c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V7l-10-5z" />
        </svg>
        <span>Asset Management</span>
      </a>
      <a
        routerLink="/inventory-manager/material-requests"
        routerLinkActive="active"
        class="nav-item"
      >
        <svg
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
          <polyline points="14 2 14 8 20 8" />
        </svg>
        <span>Material Requests</span>
      </a>
      <a
        routerLink="/inventory-manager/dispatch-logistics"
        routerLinkActive="active"
        class="nav-item"
      >
        <svg
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path
            d="M18 9h-4V5H4c-1 0-2 1-2 2v12c0 1 1 2 2 2h14c1 0 2-1 2-2v-8c0-1-1-2-2-2zm-2 0V7"
          />
        </svg>
        <span>Dispatch & Logistics</span>
      </a>
      <a routerLink="/inventory-manager/returns-rma" routerLinkActive="active" class="nav-item">
        <svg
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M3 9v10a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V9" />
          <path d="M17 13H7" />
        </svg>
        <span>Returns & RMA</span>
      </a>
      <a routerLink="/inventory-manager/procurement" routerLinkActive="active" class="nav-item">
        <svg
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path
            d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"
          />
        </svg>
        <span>Procurement</span>
      </a>
    </nav>
  </aside>

  <!-- Main area -->
  <div class="dashboard-main">
    <!-- Header -->
    <header class="dashboard-header">

      <div class="header-search-wrap">
        <svg
          class="search-icon"
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle cx="11" cy="11" r="8" />
          <line x1="21" y1="21" x2="16.65" y2="16.65" />
        </svg>
        <input class="header-search" type="text" placeholder="Search product, supplier, order" />
      </div>
      <div class="header-actions">
        <!-- Notifications -->
        <div class="notifications-container" appClickOutside (clickOutside)="closeNotifications()">
          <button
            class="icon-btn"
            aria-label="Notifications"
            (click)="toggleNotifications()"
            title="Notifications"
          >
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
              <path d="M13.73 21a2 2 0 0 1-3.46 0" />
            </svg>
            <span class="notification-badge" *ngIf="unreadCount > 0">{{ unreadCount }}</span>
          </button>

          <!-- Notifications Dropdown -->
          <div class="notifications-dropdown" *ngIf="showNotifications">
            <div class="notifications-header">
              <h3>Notifications</h3>
              <div class="notifications-actions">
                <button
                  class="action-link"
                  (click)="markAllAsRead()"
                  *ngIf="unreadCount > 0"
                  title="Mark all as read"
                >
                  <svg
                    width="14"
                    height="14"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                  >
                    <polyline points="20 6 9 17 4 12" />
                  </svg>
                </button>
                <button
                  class="action-link"
                  (click)="clearAllNotifications()"
                  *ngIf="notifications.length > 0"
                  title="Clear all"
                >
                  <svg
                    width="14"
                    height="14"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                  >
                    <line x1="18" y1="6" x2="6" y2="18" />
                    <line x1="6" y1="6" x2="18" y2="18" />
                  </svg>
                </button>
              </div>
            </div>

            <div class="notifications-list">
              <div *ngIf="notifications.length === 0" class="empty-state">
                <span>No notifications yet</span>
              </div>
              <div
                *ngFor="let notif of notifications.slice(0, 8)"
                class="notification-item"
                [class.unread]="!notif.read"
                (click)="navigateToNotification(notif)"
              >
                <span class="notif-icon">{{ getNotificationIcon(notif.type) }}</span>
                <div class="notif-content">
                  <div class="notif-title">{{ notif.title }}</div>
                  <div class="notif-message">{{ notif.message }}</div>
                </div>
                <button
                  class="notif-delete"
                  (click)="deleteNotification(notif.id, $event)"
                  aria-label="Delete"
                >
                  ✕
                </button>
              </div>
            </div>
          </div>
        </div>

        <!-- User Menu -->
        <div class="user-menu-container" appClickOutside (clickOutside)="closeUserMenu()">
          <button
            class="user-avatar"
            (click)="toggleUserMenu(); $event.stopPropagation()"
            aria-label="User menu"
            title="User menu"
          >
            {{ userInitials }}
          </button>

          <!-- User Dropdown -->
          <div class="user-dropdown" *ngIf="showUserMenu">
            <div class="user-header">
              <div class="user-avatar-lg">{{ userInitials }}</div>
              <div>
                <div class="user-name">{{ userName }}</div>
                <div class="user-email">{{ userEmail }}</div>
              </div>
            </div>
            <div class="menu-divider"></div>

            <button class="menu-item logout" (click)="logout()">
              <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
              >
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                <polyline points="16 17 21 12 16 7" />
                <line x1="21" y1="12" x2="9" y2="12" />
              </svg>
              Sign out
            </button>
          </div>
        </div>
      </div>
    </header>

    <!-- Page content -->
    <main class="dashboard-content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
